<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<title>NiaHealth Quiz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; overflow: hidden; }
  body { height: 100%; min-height: 100dvh; max-height: 100dvh; overflow: hidden; max-width: 100vw; background: #e8e4df; display: flex; justify-content: center; font-family: 'DM Sans', -apple-system, sans-serif; }
  .card { background: #fff; border: 3px solid #1a1a1a; border-radius: 0; padding: clamp(10px, 2.5vw, 20px); width: 100%; max-width: min(680px, 100vw); flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: stretch; min-height: 0; overflow: hidden; box-shadow: 6px 6px 0 #1a1a1a; }
  @media (min-width: 640px) { body { align-items: center; } .card { flex: none; width: 560px; height: 600px; min-height: 600px; border-radius: 4px; margin: auto; } }
  .tab-panels { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; width: 100%; }
  .tab-panels > div[id^="tab-"] { flex: 1; min-height: 0; display: none; flex-direction: column; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; width: 100%; }
  .tab-panels > div[id^="tab-"]::-webkit-scrollbar { display: none; }
  .progress-bar { height: 12px; background: #e8e4df; border: 2px solid #1a1a1a; border-radius: 0; margin-bottom: 12px; overflow: hidden; }
  .progress-fill { height: 100%; background: #ff6b35; border-radius: 0; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
  .progress-fill::after { display: none; }
  .question-card { background: #fff; border: none; border-radius: 0; padding: 12px; margin-bottom: 10px; }
  .question-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .question-num { font-weight: 800; color: #1a1a1a; font-size: 14px; text-transform: uppercase; }
  .question-marks { background: #ffe15a; color: #1a1a1a; border: 2px solid #1a1a1a; padding: 4px 10px; border-radius: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.02em; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .question-marks.bounce { animation: pts-bounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes pts-bounce { 0% { transform: scale(1); } 35% { transform: scale(1.35); } 100% { transform: scale(1); } }
  h2 { color: #1a1a1a; font-size: 15px; line-height: 1.4; margin-bottom: 12px; font-weight: 800; overflow-wrap: break-word; }
  .opt { cursor: pointer; border: 2px solid #1a1a1a; border-radius: 0; padding: 10px 12px; margin-bottom: 6px; display: flex; align-items: flex-start; gap: 10px; background: #fff; transition: all 0.12s; width: 100%; box-sizing: border-box; flex-shrink: 0; box-shadow: 1.5px 1.5px 0 #1a1a1a; }
  .opt:hover { background: #f5f0e8; transform: translate(-1px, -1px); box-shadow: 2.5px 2.5px 0 #1a1a1a; }
  .opt.selected { background: #ffe15a; transform: translate(1px, 1px); box-shadow: 1px 1px 0 #1a1a1a; }
  .opt.correct { border-color: #1a1a1a; background: #b8f5c8; }
  .opt.wrong { border-color: #1a1a1a; background: #ffb3b3; }
  .badge { width: 28px; height: 28px; border-radius: 0; border: 2px solid #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; transition: all 0.2s; }
  .badge-a { background: #c4e0ff; color: #1a1a1a; }
  .badge-b { background: #f5c4e8; color: #1a1a1a; }
  .badge-c { background: #b8f5c8; color: #1a1a1a; }
  .badge-d { background: #ffe15a; color: #1a1a1a; }
  .opt.selected .badge { background: #1a1a1a; color: #fff; }
  .opt.correct .badge { background: #1a1a1a; color: #b8f5c8; }
  .opt.wrong .badge { background: #1a1a1a; color: #ffb3b3; }
  .opt-text { color: #1a1a1a; font-size: 14px; flex: 1; min-width: 0; line-height: 1.4; overflow-wrap: break-word; font-weight: 500; }
  .feedback { border-radius: 0; padding: 10px 12px; margin-top: 12px; margin-bottom: 10px; font-size: 13px; border: 2px solid #1a1a1a; }
  .feedback.good { background: #b8f5c8; color: #1a1a1a; }
  .feedback.bad { background: #ffb3b3; color: #1a1a1a; }
  .actions { display: flex; justify-content: space-between; align-items: stretch; gap: 12px; width: 100%; box-sizing: border-box; padding: 2px 4px 6px 4px; }
  .actions .btn, .actions .btn-secondary { flex: 1 1 0; min-width: 0; width: 0; padding: 8px 16px; font-size: 13px; }
  .btn-arrow { display: inline-block; font-size: 1.15em; margin: 0 0.3em; }
  @media (max-width: 640px) { .btn-arrow { font-size: 1.5em; } }
  .btn { background: #1a1a1a; color: #fff; border: 2px solid #1a1a1a; border-radius: 0; padding: 10px 20px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; box-shadow: 3px 3px 0 #1a1a1a; transition: all 0.1s; }
  .btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 #1a1a1a; }
  .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #1a1a1a; }
  .btn:disabled { background: #d6d3d1; color: #a8a29e; border-color: #a8a29e; box-shadow: 1.5px 1.5px 0 #a8a29e; cursor: not-allowed; transform: none; }
  .btn-secondary { background: #fff; color: #1a1a1a; border: 2px solid #1a1a1a; box-shadow: 3px 3px 0 #1a1a1a; }
  .btn-secondary:hover { background: #f5f0e8; transform: translate(-1px, -1px); box-shadow: 4px 4px 0 #1a1a1a; }
  .btn-secondary:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #1a1a1a; }
  .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: 1.5px 1.5px 0 #a8a29e; transform: none; }
  .btn-accent { background: #ffe15a; color: #1a1a1a; border: 2px solid #1a1a1a; box-shadow: 3px 3px 0 #1a1a1a; }
  .btn-accent:hover { background: #ffec8b; transform: translate(-1px, -1px); box-shadow: 4px 4px 0 #1a1a1a; }
  .btn-accent:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #1a1a1a; }
  .btn-accent:disabled { background: #d6d3d1; color: #a8a29e; border-color: #a8a29e; box-shadow: 1.5px 1.5px 0 #a8a29e; cursor: not-allowed; transform: none; }
  /* Results */
  h1 { color: #1a1a1a; font-size: 24px; font-weight: 800; margin-bottom: 6px; }
  .subtitle { color: #64748b; margin-bottom: 16px; font-size: 14px; }
  .score-box { background: #fff; border: 2px solid #1a1a1a; border-radius: 0; padding: 20px; text-align: center; margin-bottom: 20px; position: relative; box-shadow: 3px 3px 0 #1a1a1a; }
  .score-gauge-wrap { position: relative; width: 160px; height: 90px; margin: 0 auto 12px; }
  .score-gauge-wrap svg { width: 100%; height: 100%; }
  .score-gauge-bg { fill: none; stroke: #e8e4df; stroke-width: 10; stroke-linecap: butt; }
  .score-gauge-fill { fill: none; stroke-width: 10; stroke-linecap: butt; stroke-dasharray: 125.6; transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
  .score-num { font-size: 48px; font-weight: 700; line-height: 1; }
  .score-total { font-size: 28px; color: #64748b; }
  .score-msg { color: #64748b; margin-top: 8px; font-size: 15px; }
  .submit-score .retake-wrap .btn { padding: 14px 32px; font-size: 16px; }
  .review-title { color: #1e293b; font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  .review-item { border: 2px solid #1a1a1a; border-radius: 0; padding: 12px; margin-bottom: 10px; background: #fff; }
  .review-q { color: #334155; font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .review-explain { color: #64748b; font-size: 13px; margin-top: 10px; line-height: 1.5; }
  .tag { border-radius: 0; border: 1.5px solid #1a1a1a; padding: 2px 8px; font-size: 12px; display: inline-block; margin: 2px; font-weight: 700; }
  .tag-wrong { background: #ffb3b3; color: #1a1a1a; }
  .tag-right { background: #b8f5c8; color: #1a1a1a; }
  #quiz-screen, #results-screen { display: none; }
  #quiz-screen.active { display: flex; flex-direction: column; flex: 1; min-height: 0; width: 100%; }
  #results-screen.active { display: block; }
  #quiz-screen .progress-bar { flex-shrink: 0; width: 100%; }
  #quiz-screen .actions { flex-shrink: 0; width: 100%; }
  #quiz-screen .question-card { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; margin-bottom: 8px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #d6d3d1 transparent; }
  #quiz-screen .question-card::-webkit-scrollbar { width: 4px; }
  #quiz-screen .question-card::-webkit-scrollbar-track { background: transparent; }
  #quiz-screen .question-card::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 2px; }
  #quiz-screen .question-card .question-header { flex-shrink: 0; }
  #quiz-screen .question-card > h2 { flex-shrink: 0; }
  #quiz-screen .question-card #feedback { flex-shrink: 0; }
  #quiz-screen #options-container { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  #quiz-screen #options-container .opt { margin-bottom: 0; flex-shrink: 0; }
  #quiz-screen .actions { flex-shrink: 0; width: 100%; }
  /* Page header */
  .page-header { display: none; }
  /* Tabs */
  .tabs-wrap { position: relative; flex-shrink: 0; margin-bottom: 12px; }
  .tabs { display: flex; gap: 0; border-bottom: 3px solid #1a1a1a; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: #1a1a1a transparent; }
  .tabs::-webkit-scrollbar { height: 4px; }
  .tabs::-webkit-scrollbar-track { background: transparent; }
  .tabs::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 0; }
  @media (max-width: 640px) {
    .tabs-wrap::after { content: ''; position: absolute; top: 0; right: 0; bottom: 4px; width: 24px; background: linear-gradient(to left, #fff 40%, transparent); pointer-events: none; }
  }
  .tab-btn { flex-shrink: 0; background: none; border: none; border-bottom: 3px solid transparent; border-radius: 0; padding: 10px 20px; font-size: 14px; font-weight: 700; color: #a8a29e; cursor: pointer; font-family: inherit; transition: all 0.15s; margin-bottom: -3px; text-transform: uppercase; letter-spacing: 0.04em; }
  .tab-btn:hover { color: #1a1a1a; }
  .tab-btn.active { color: #1a1a1a; border-bottom-color: #ff6b35; background: #ffe15a; }
  /* Leaderboard */
  .leaderboard-date-row { margin-bottom: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .leaderboard-date-row label { color: #64748b; font-size: 14px; }
  .leaderboard-date-row select { background: #fff; border: 2px solid #1a1a1a; border-radius: 0; padding: 8px 12px; font-size: 14px; color: #1a1a1a; font-family: inherit; cursor: pointer; font-weight: 600; }
  .leaderboard-list { overflow-y: auto; }
  .leaderboard-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 2px solid #1a1a1a; }
  .leaderboard-row:last-child { border-bottom: none; }
  .leaderboard-rank { font-weight: 700; color: #1a1a1a; min-width: 28px; }
  .leaderboard-name { color: #1a1a1a; font-weight: 600; }
  .leaderboard-score { color: #1a1a1a; font-weight: 700; background: #ffe15a; border: 1.5px solid #1a1a1a; padding: 1px 8px; box-shadow: 1.5px 1.5px 0 #1a1a1a; }
  .leaderboard-empty { color: #1a1a1a; padding: 24px; text-align: center; font-weight: 600; }
  /* Submit score */
  .submit-score { margin-top: 16px; padding-top: 16px; border-top: 3px solid #1a1a1a; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .submit-score .submit-row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; }
  .submit-score input { background: #fff; border: 2px solid #1a1a1a; border-radius: 0; padding: 12px 16px; font-size: 15px; color: #1a1a1a; width: min(200px, 100%); font-family: inherit; font-weight: 600; }
  .submit-score input::placeholder { color: #94a3b8; }
  .submit-score .submit-msg { color: #1a1a1a; font-size: 14px; font-weight: 700; background: #b8f5c8; border: 1.5px solid #1a1a1a; padding: 4px 10px; }
  .submit-score .retake-wrap { margin-top: 12px; }
  /* Comments */
  #tab-comments { display: flex; flex-direction: column; }
  .comments-header { color: #1a1a1a; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .comments-prompt { color: #555; font-size: 12px; margin-bottom: 8px; font-weight: 500; }
  .feedback-form { margin-top: 16px; margin-bottom: 8px; padding-top: 12px; padding-bottom: 6px; border-top: 2px solid #1a1a1a; }
  .feedback-form .btn { width: 100%; display: block; }
  .feedback-input, .feedback-textarea { width: 100%; background: #fff; border: 2px solid #1a1a1a; border-radius: 0; padding: 8px 12px; font-size: 14px; color: #1a1a1a; font-family: inherit; font-weight: 500; }
  .feedback-input::placeholder, .feedback-textarea::placeholder { color: #94a3b8; }
  .feedback-textarea { resize: vertical; min-height: 40px; max-height: 80px; }
  .comments-list { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
  .comments-list::-webkit-scrollbar { width: 6px; }
  .comments-list::-webkit-scrollbar-track { background: transparent; }
  .comments-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  .comments-list::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  .load-more-comments { margin-top: 12px; text-align: center; }
  .load-more-comments .btn { padding: 10px 24px; font-size: 14px; }
  .comment-item { border: 2px solid #1a1a1a; border-radius: 0; padding: 14px 18px; margin: 0 auto 12px; max-width: 88%; background: #fff; box-shadow: 2px 2px 0 #1a1a1a; }
  .comment-author { color: #1a1a1a; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .comment-author.anonymous { color: #555; font-style: italic; }
  .comment-body { color: #1a1a1a; font-size: 14px; line-height: 1.5; }
  .comment-date { color: #555; font-size: 12px; margin-top: 8px; font-weight: 600; }
  /* Practice */
  #tab-practice { display: flex; flex-direction: column; }
  #practice-screen .question-card { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-bottom: 8px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #d6d3d1 transparent; }
  #practice-screen .question-card::-webkit-scrollbar { width: 4px; }
  #practice-screen .question-card::-webkit-scrollbar-track { background: transparent; }
  #practice-screen .question-card::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 2px; }
  #practice-screen #practice-options-container { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  #practice-screen #practice-options-container .opt { margin-bottom: 0; flex-shrink: 0; }
</style>
</head>
<body>
<div class="card">
  <div class="page-header">
    <h1 class="page-title">Today's Quiz</h1>
  </div>
  <div class="tabs-wrap">
    <div class="tabs">
      <button class="tab-btn active" data-tab="quiz">Daily Quiz</button>
      <button class="tab-btn" data-tab="practice">Practice</button>
      <button class="tab-btn" data-tab="leaderboard">Leaderboard</button>
      <button class="tab-btn" data-tab="comments">Comments</button>
    </div>
  </div>
  <div class="tab-panels">
  <div id="tab-quiz" style="display:flex;">
  <div id="quiz-screen" class="active">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="question-card">
      <div class="question-header">
        <span class="question-num" id="question-num">Q1</span>
        <span class="question-marks" id="question-marks">0 pts</span>
      </div>
      <h2 id="question-text"></h2>
      <div id="options-container"></div>
      <div id="feedback" style="display:none"></div>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" id="prev-btn" onclick="goPrevious()" style="display:none;"><span class="btn-arrow">←</span> Previous</button>
      <button class="btn btn-accent" id="action-btn" onclick="handleAction()">Confirm Answer</button>
    </div>
  </div>

  <div id="results-screen">
    <h1>Quiz Complete</h1>
    <p class="subtitle">NiaHealth Biomarkers & Plans</p>
    <div class="score-box">
      <div class="score-gauge-wrap">
        <svg viewBox="0 0 100 50">
          <path class="score-gauge-bg" d="M 10 45 A 40 40 0 0 1 90 45" />
          <path id="score-gauge-fill" class="score-gauge-fill" d="M 10 45 A 40 40 0 0 1 90 45" stroke-dashoffset="125.6" />
        </svg>
      </div>
      <div class="score-num" id="score-num"></div>
      <div class="score-msg" id="score-msg"></div>
    </div>
    <div id="review-container"></div>
    <div class="submit-score">
      <p style="color:#9ca3af;font-size:14px;">Add your name to the leaderboard?</p>
      <div class="submit-row">
        <input type="text" id="leaderboard-name" placeholder="Your name" maxlength="30" />
        <button class="btn" onclick="submitToLeaderboard()">Submit Score</button>
      </div>
      <div id="submit-msg" class="submit-msg" style="display:none;"></div>
      <div class="retake-wrap">
        <button class="btn btn-secondary" onclick="restartQuiz()">Retake Quiz</button>
      </div>
    </div>
  </div>
  </div>

  <div id="tab-practice" style="display:none;">
    <div id="practice-screen" style="display:flex;flex-direction:column;flex:1;min-height:0;width:100%;">
      <div class="progress-bar"><div class="progress-fill" id="practice-progress-fill" style="width:0%"></div></div>
      <div class="question-card">
        <div class="question-header">
          <span class="question-num" id="practice-question-num">Q1</span>
        </div>
        <h2 id="practice-question-text"></h2>
        <div id="practice-options-container"></div>
        <div id="practice-feedback" class="feedback" style="display:none"></div>
      </div>
      <div class="actions">
        <button class="btn btn-secondary" id="practice-prev-btn" onclick="practicePrevious()" style="display:none;"><span class="btn-arrow">←</span> Previous</button>
        <button class="btn btn-accent" id="practice-action-btn" onclick="handlePracticeAction()">Confirm Answer</button>
      </div>
    </div>
  </div>

  <div id="tab-leaderboard" style="display:none;">
    <h1 style="margin-bottom:8px;">Leaderboard</h1>
    <p class="subtitle">Top scores — resets daily (shared)</p>
    <div class="leaderboard-date-row">
      <label for="leaderboard-date">View:</label>
      <select id="leaderboard-date" onchange="loadAndRenderLeaderboard()"></select>
    </div>
    <div id="leaderboard-list" class="leaderboard-list"></div>
    <div id="leaderboard-empty" class="leaderboard-empty" style="display:none;">No scores yet. Complete the quiz and submit your score!</div>
  </div>

  <div id="tab-comments" style="display:none;">
    <div class="comments-header">Comments</div>
    <p class="comments-prompt" id="comments-prompt">Let me know if there are any factual errors.</p>
    <div id="comments-list" class="comments-list"></div>
    <div id="load-more-comments" class="load-more-comments" style="display:none;">
      <button class="btn btn-secondary" onclick="loadMoreComments()">Load more comments</button>
    </div>
    <form id="comment-form" class="feedback-form">
      <input type="text" id="comment-name" placeholder="Your name (optional — leave blank for anonymous)" class="feedback-input" style="margin-bottom:10px;" maxlength="50" />
      <textarea id="comment-text" placeholder="Your comment..." required class="feedback-textarea" rows="2"></textarea>
      <button type="submit" class="btn btn-accent" style="margin-top:8px;padding:8px 16px;font-size:13px;">Post Comment</button>
    </form>
  </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="questions.js"></script>
<script>
const QUESTIONS_PER_QUIZ = 20;
const LEADERBOARD_KEY = 'nia-quiz-leaderboard';
const LEADERBOARD_MAX = 50;
const COMMENTS_KEY = 'nia-quiz-comments';
const COMMENTS_PAGE_SIZE = 10;
let commentsLastDoc = null;
let commentsHasMore = false;
let allComments = [];

let db = null;
if (typeof firebaseConfig !== 'undefined' && firebaseConfig.apiKey && firebaseConfig.apiKey !== 'YOUR_API_KEY') {
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  } catch (e) { console.warn('Firebase init failed:', e); }
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('[id^="tab-"]').forEach(p => p.style.display = 'none');
    btn.classList.add('active');
    const tabEl = document.getElementById('tab-' + tab);
    tabEl.style.display = 'flex';
    if (tab === 'leaderboard') loadAndRenderLeaderboard();
    if (tab === 'comments') loadAndRenderComments();
    if (tab === 'practice') startPractice();
  });
});

let practiceShuffled = [];
let practiceCurrent = 0;
let practiceSelected = null;
let practiceConfirmed = false;

function startPractice() {
  const pool = typeof BIOMARKER_QUESTIONS !== 'undefined' ? BIOMARKER_QUESTIONS : [];
  practiceShuffled = shuffleWithSeed(pool, Date.now().toString());
  practiceCurrent = 0;
  practiceSelected = null;
  practiceConfirmed = false;
  renderPracticeQuestion();
}

function renderPracticeQuestion() {
  if (!practiceShuffled.length) {
    document.getElementById('practice-question-num').textContent = '';
    document.getElementById('practice-question-text').textContent = 'No questions available.';
    document.getElementById('practice-options-container').innerHTML = '';
    document.getElementById('practice-feedback').style.display = 'none';
    document.getElementById('practice-prev-btn').style.display = 'none';
    document.getElementById('practice-action-btn').style.display = 'none';
    return;
  }
  const q = practiceShuffled[practiceCurrent];
  document.getElementById('practice-prev-btn').style.display = practiceCurrent > 0 ? 'inline-block' : 'none';
  document.getElementById('practice-action-btn').style.display = '';
  document.getElementById('practice-progress-fill').style.width = `${(practiceCurrent / practiceShuffled.length) * 100}%`;
  document.getElementById('practice-question-num').textContent = `Q${practiceCurrent + 1} of ${practiceShuffled.length}`;
  document.getElementById('practice-question-text').textContent = q.q;
  document.getElementById('practice-feedback').style.display = 'none';
  document.getElementById('practice-prev-btn').style.display = practiceCurrent > 0 ? 'inline-block' : 'none';

  if (practiceConfirmed) {
    document.getElementById('practice-action-btn').innerHTML = practiceCurrent + 1 >= practiceShuffled.length ? 'Next question' : 'Next <span class="btn-arrow">→</span>';
    document.getElementById('practice-action-btn').disabled = false;
    const container = document.getElementById('practice-options-container');
    container.innerHTML = '';
    q.options.forEach((opt, i) => {
      const div = document.createElement('div');
      div.className = 'opt';
      if (i === q.answer) div.classList.add('correct');
      else if (i === practiceSelected) div.classList.add('wrong');
      const badgeText = i === q.answer ? '✓' : (i === practiceSelected ? '✗' : labels[i]);
      div.innerHTML = `<div class="badge ${badgeClasses[i]}">${badgeText}</div><span class="opt-text">${opt}</span>`;
      div.id = `practice-opt-${i}`;
      container.appendChild(div);
    });
    const fb = document.getElementById('practice-feedback');
    fb.style.display = 'block';
    const correct = practiceSelected === q.answer;
    const explain = q.explanation ? `<div style="margin-top:10px;font-size:13px;opacity:0.9;">${q.explanation}</div>` : '';
    if (correct) {
      fb.className = 'feedback good';
      fb.innerHTML = '✓ Correct!' + explain;
    } else {
      fb.className = 'feedback bad';
      fb.innerHTML = `✗ Correct answer: ${q.options[q.answer]}` + explain;
    }
  } else {
    document.getElementById('practice-action-btn').textContent = 'Confirm Answer';
    document.getElementById('practice-action-btn').disabled = true;
    const container = document.getElementById('practice-options-container');
    container.innerHTML = '';
    q.options.forEach((opt, i) => {
      const div = document.createElement('div');
      div.className = 'opt';
      div.innerHTML = `<div class="badge ${badgeClasses[i]}">${labels[i]}</div><span class="opt-text">${opt}</span>`;
      div.onclick = () => practiceSelectOption(i);
      div.id = `practice-opt-${i}`;
      container.appendChild(div);
    });
  }
}

function practiceSelectOption(i) {
  if (practiceConfirmed) return;
  practiceSelected = i;
  document.querySelectorAll('#practice-options-container .opt').forEach((el, idx) => {
    el.classList.toggle('selected', idx === i);
    const badge = el.querySelector('.badge');
    badge.textContent = labels[idx];
    badge.className = 'badge ' + badgeClasses[idx];
  });
  document.getElementById('practice-action-btn').disabled = false;
}

function practicePrevious() {
  if (practiceCurrent <= 0) return;
  practiceCurrent--;
  practiceSelected = null;
  practiceConfirmed = false;
  renderPracticeQuestion();
}

function handlePracticeAction() {
  if (!practiceConfirmed) {
    practiceConfirmed = true;
    const q = practiceShuffled[practiceCurrent];
    practiceSelected = practiceSelected ?? -1;
    q.options.forEach((_, i) => {
      const el = document.getElementById(`practice-opt-${i}`);
      const badge = el.querySelector('.badge');
      if (i === q.answer) { el.classList.add('correct'); badge.textContent = '✓'; }
      else if (i === practiceSelected) { el.classList.add('wrong'); badge.textContent = '✗'; }
    });
    const fb = document.getElementById('practice-feedback');
    fb.style.display = 'block';
    const correct = practiceSelected === q.answer;
    const explain = q.explanation ? `<div style="margin-top:10px;font-size:13px;opacity:0.9;">${q.explanation}</div>` : '';
    if (correct) {
      fb.className = 'feedback good';
      fb.innerHTML = '✓ Correct!' + explain;
    } else {
      fb.className = 'feedback bad';
      fb.innerHTML = `✗ Correct answer: ${q.options[q.answer]}` + explain;
    }
    document.getElementById('practice-action-btn').innerHTML = practiceCurrent + 1 >= practiceShuffled.length ? 'Next question' : 'Next <span class="btn-arrow">→</span>';
  } else {
    practiceCurrent = (practiceCurrent + 1) % practiceShuffled.length;
    practiceSelected = null;
    practiceConfirmed = false;
    renderPracticeQuestion();
  }
}

function formatCommentDate(ts) {
  const d = new Date(typeof ts === 'object' && ts?.seconds ? ts.seconds * 1000 : ts);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

async function loadAndRenderComments(reset = true) {
  const container = document.getElementById('comments-list');
  const loadMoreEl = document.getElementById('load-more-comments');
  if (db) {
    if (reset) {
      container.innerHTML = '<div class="leaderboard-empty">Loading comments...</div>';
      commentsLastDoc = null;
      allComments = [];
    }
    loadMoreEl.style.display = 'none';
    try {
      let q = db.collection('comments').orderBy('date', 'desc').limit(COMMENTS_PAGE_SIZE);
      if (!reset && commentsLastDoc) q = q.startAfter(commentsLastDoc);
      const snap = await q.get();
      const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      commentsHasMore = snap.docs.length === COMMENTS_PAGE_SIZE;
      if (snap.docs.length > 0) commentsLastDoc = snap.docs[snap.docs.length - 1];
      allComments = reset ? list : [...allComments, ...list];
      renderComments(allComments);
      if (commentsHasMore) loadMoreEl.style.display = 'block';
    } catch (e) {
      container.innerHTML = '<div class="leaderboard-empty">Could not load comments. Check Firebase config.</div>';
      const prompt = document.getElementById('comments-prompt');
      if (prompt) prompt.textContent = 'Let me know if there are any factual errors. (Local only — add Firebase config for shared comments.)';
    }
  } else {
    const list = getCommentsLocal();
    if (reset) allComments = list.slice(0, COMMENTS_PAGE_SIZE);
    else allComments = list.slice(0, allComments.length + COMMENTS_PAGE_SIZE);
    renderComments(allComments);
    loadMoreEl.style.display = allComments.length < list.length ? 'block' : 'none';
    const prompt = document.getElementById('comments-prompt');
    if (prompt) prompt.textContent = 'Let me know if there are any factual errors. (Local only — add Firebase config for shared comments.)';
  }
}

async function loadMoreComments() {
  await loadAndRenderComments(false);
}

function getCommentsLocal() {
  try {
    const raw = localStorage.getItem(COMMENTS_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}

async function saveComment(comment) {
  const nameInput = document.getElementById('comment-name');
  const textInput = document.getElementById('comment-text');
  const name = (nameInput.value || '').trim() || 'Anonymous';
  const text = (textInput.value || '').trim();
  if (!text) return;
  const data = { name, text, date: db ? firebase.firestore.Timestamp.now() : Date.now() };

  if (db) {
    try {
      await db.collection('comments').add(data);
      nameInput.value = '';
      textInput.value = '';
      loadAndRenderComments();
    } catch (e) {
      alert('Could not post comment. Check Firebase config.');
    }
  } else {
    const list = getCommentsLocal();
    list.unshift({ ...data, date: Date.now() });
    localStorage.setItem(COMMENTS_KEY, JSON.stringify(list.slice(0, 200)));
    nameInput.value = '';
    textInput.value = '';
    renderComments(list);
  }
}

function renderComments(list) {
  const container = document.getElementById('comments-list');
  if (!list || list.length === 0) {
    container.innerHTML = '<div class="leaderboard-empty">No comments yet. Be the first!</div>';
    return;
  }
  container.innerHTML = list.map(c => {
    const author = (c.name || '').trim() || 'Anonymous';
    const authorClass = author === 'Anonymous' ? 'comment-author anonymous' : 'comment-author';
    const dateStr = formatCommentDate(c.date);
    return `<div class="comment-item"><div class="${authorClass}">${escapeHtml(author)}</div><div class="comment-body">${escapeHtml(c.text)}</div><div class="comment-date">${dateStr}</div></div>`;
  }).join('');
}

document.getElementById('comment-form').addEventListener('submit', (e) => {
  e.preventDefault();
  saveComment();
});

function getDateString() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function entryDateStr(e) {
  if (e.dateStr) return e.dateStr;
  if (e.date) {
    const ts = e.date;
    const ms = typeof ts?.toDate === 'function' ? ts.toDate().getTime() : (ts?.seconds ? ts.seconds * 1000 : ts);
    const d = new Date(ms);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  return '';
}

async function loadAndRenderLeaderboard() {
  const container = document.getElementById('leaderboard-list');
  const empty = document.getElementById('leaderboard-empty');
  const dateSelect = document.getElementById('leaderboard-date');
  const selectedDate = (dateSelect && dateSelect.value) ? dateSelect.value : getDateString();

  if (db) {
    container.innerHTML = '';
    empty.style.display = 'none';
    empty.textContent = 'Loading...';
    empty.style.display = 'block';
    try {
      const snap = await db.collection('leaderboard').limit(500).get();
      const allEntries = snap.docs.map(d => d.data());
      const dates = [...new Set(allEntries.map(e => entryDateStr(e)).filter(Boolean))].sort().reverse();
      if (dateSelect) {
        const today = getDateString();
        if (dateSelect.options.length === 0 || !dateSelect.querySelector('option[value="' + today + '"]')) {
          dateSelect.innerHTML = '<option value="' + today + '">Today</option>';
          dates.filter(d => d !== today).forEach(d => {
            dateSelect.innerHTML += '<option value="' + d + '">' + formatDateLabel(d) + '</option>';
          });
        }
        if (!dateSelect.value || dateSelect.value === '') dateSelect.value = today;
      }
      const list = allEntries.filter(e => entryDateStr(e) === selectedDate).sort((a, b) => (b.score || 0) - (a.score || 0)).slice(0, 20);
      empty.style.display = 'none';
      renderLeaderboard(list, selectedDate);
    } catch (e) {
      console.error('Leaderboard error:', e);
      empty.textContent = 'Could not load leaderboard. Check Firebase config and indexes.';
      empty.style.display = 'block';
    }
  } else {
    const list = getLeaderboardForDate(selectedDate);
    if (dateSelect && dateSelect.options.length === 0) {
      const all = getLeaderboardLocalAll();
      const dates = [...new Set(all.map(e => entryDateStr(e)).filter(Boolean))].sort().reverse();
      const today = getDateString();
      dateSelect.innerHTML = '<option value="' + today + '">Today</option>';
      dates.filter(d => d !== today).forEach(d => {
        dateSelect.innerHTML += '<option value="' + d + '">' + formatDateLabel(d) + '</option>';
      });
      if (!dateSelect.value) dateSelect.value = today;
    }
    renderLeaderboard(list, selectedDate);
  }
}

function formatDateLabel(dateStr) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  const today = new Date();
  if (dateStr === getDateString()) return 'Today';
  if (date.getTime() === today.getTime() - 86400000) return 'Yesterday';
  return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

function getLeaderboardLocalAll() {
  try {
    const raw = localStorage.getItem(LEADERBOARD_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}

function getLeaderboardForDate(dateStr) {
  const all = getLeaderboardLocalAll();
  const today = getDateString();
  const useDate = dateStr || today;
  return all.filter(e => entryDateStr(e) === useDate).sort((a, b) => b.score - a.score);
}

function getLeaderboardLocal() {
  return getLeaderboardForDate(getDateString());
}

async function getTodayLeaderboard() {
  const today = getDateString();
  if (db) {
    try {
      const snap = await db.collection('leaderboard').limit(100).get();
      return snap.docs.map(d => d.data()).filter(e => entryDateStr(e) === today).sort((a, b) => (b.score || 0) - (a.score || 0));
    } catch { return []; }
  }
  return getLeaderboardLocal();
}

async function saveToLeaderboard(entry) {
  const today = getDateString();
  const fullEntry = { ...entry, dateStr: today };

  if (db) {
    try {
      await db.collection('leaderboard').add(fullEntry);
    } catch (e) {
      alert('Could not save to leaderboard. Check Firebase config.');
      return;
    }
  } else {
    try {
      const raw = localStorage.getItem(LEADERBOARD_KEY);
      const all = raw ? JSON.parse(raw) : [];
      const otherDays = all.filter(e => entryDateStr(e) !== today);
      const todayEntries = all.filter(e => entryDateStr(e) === today);
      todayEntries.push(fullEntry);
      todayEntries.sort((a, b) => b.score - a.score);
      const merged = [...todayEntries.slice(0, 50), ...otherDays].slice(0, 100);
      localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(merged));
    } catch { localStorage.setItem(LEADERBOARD_KEY, JSON.stringify([fullEntry])); }
  }
}

function renderLeaderboard(list, dateStr) {
  const container = document.getElementById('leaderboard-list');
  const empty = document.getElementById('leaderboard-empty');
  const isToday = !dateStr || dateStr === getDateString();
  empty.textContent = isToday ? 'No scores yet today. Complete the quiz and submit your score!' : 'No scores for this date.';
  if (!list || list.length === 0) {
    container.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  container.innerHTML = list.slice(0, 20).map((e, i) =>
    `<div class="leaderboard-row"><span class="leaderboard-rank">#${i + 1}</span><span class="leaderboard-name">${escapeHtml(e.name)}</span><span class="leaderboard-score">${e.score}/${e.total}</span></div>`
  ).join('');
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

async function submitToLeaderboard() {
  const input = document.getElementById('leaderboard-name');
  const name = ((input.value || '').trim() || 'Anonymous').slice(0, 30);
  await saveToLeaderboard({ name, score, total: shuffled.length });
  input.value = '';
  input.disabled = true;
  const msg = document.getElementById('submit-msg');
  msg.textContent = '✓ Added to leaderboard!';
  msg.style.display = 'block';
  await loadAndRenderLeaderboard();
  document.querySelector('[data-tab="leaderboard"]').click();
}

const labels = ["A","B","C","D"];
const badgeClasses = ["badge-a","badge-b","badge-c","badge-d"];
let current = 0, score = 0, selected = null, confirmed = false, results = [];
let shuffled = [];

function seededRandom(seedStr) {
  let h = 0;
  for (let i = 0; i < seedStr.length; i++) { h = ((h << 5) - h) + seedStr.charCodeAt(i); h |= 0; }
  let seed = (h >>> 0) || 1;
  return function() {
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffleWithSeed(arr, seedStr) {
  const rng = seededRandom(seedStr);
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  const pool = typeof BIOMARKER_QUESTIONS !== 'undefined' ? BIOMARKER_QUESTIONS : [];
  const daySeed = getDateString();
  shuffled = shuffleWithSeed(pool, daySeed).slice(0, QUESTIONS_PER_QUIZ);
  current = 0; score = 0; selected = null; confirmed = false; results = [];
  renderQuestion();
}

function renderQuestion() {
  const q = shuffled[current];
  const prevResult = results[current];
  document.getElementById('progress-fill').style.width = `${(current/shuffled.length)*100}%`;
  document.getElementById('question-num').textContent = `Q${current + 1}`;
  document.getElementById('question-marks').textContent = score === 1 ? '1 pt' : `${score} pts`;
  document.getElementById('question-text').textContent = q.q;
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('prev-btn').style.display = current > 0 ? 'inline-block' : 'none';

  if (prevResult) {
    confirmed = true;
    selected = prevResult.chosen;
    document.getElementById('action-btn').innerHTML = current + 1 >= shuffled.length ? 'See Results' : 'Next <span class="btn-arrow">→</span>';
    document.getElementById('action-btn').disabled = false;
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    q.options.forEach((opt, i) => {
      const div = document.createElement('div');
      div.className = 'opt';
      if (i === q.answer) div.classList.add('correct');
      else if (i === prevResult.chosen) div.classList.add('wrong');
      const badgeText = i === q.answer ? '✓' : (i === prevResult.chosen ? '✗' : labels[i]);
      div.innerHTML = `<div class="badge ${badgeClasses[i]}">${badgeText}</div><span class="opt-text">${opt}</span>`;
      div.id = `opt-${i}`;
      container.appendChild(div);
    });
    const fb = document.getElementById('feedback');
    fb.style.display = 'block';
    const explain = q.explanation ? `<div style="margin-top:10px;font-size:13px;opacity:0.9;">${q.explanation}</div>` : '';
    if (prevResult.correct) {
      fb.className = 'feedback good';
      fb.innerHTML = '✓ Correct!' + explain;
    } else {
      fb.className = 'feedback bad';
      fb.innerHTML = `✗ Correct answer: ${q.options[q.answer]}` + explain;
    }
  } else {
    confirmed = false;
    selected = null;
    document.getElementById('action-btn').textContent = 'Confirm Answer';
    document.getElementById('action-btn').disabled = true;
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    q.options.forEach((opt, i) => {
      const div = document.createElement('div');
      div.className = 'opt';
      div.innerHTML = `<div class="badge ${badgeClasses[i]}">${labels[i]}</div><span class="opt-text">${opt}</span>`;
      div.onclick = () => selectOption(i);
      div.id = `opt-${i}`;
      container.appendChild(div);
    });
  }
}

function goPrevious() {
  if (current <= 0) return;
  current--;
  renderQuestion();
}

function selectOption(i) {
  if (confirmed) return;
  selected = i;
  document.querySelectorAll('.opt').forEach((el, idx) => {
    el.classList.toggle('selected', idx === i);
    const badge = el.querySelector('.badge');
    badge.textContent = labels[idx];
    badge.className = 'badge ' + badgeClasses[idx];
    if (idx === i) badge.className = 'badge ' + badgeClasses[idx];
  });
  document.getElementById('action-btn').disabled = false;
}

async function handleAction() {
  if (!confirmed) {
    confirmed = true;
    const q = shuffled[current];
    const correct = selected === q.answer;
    if (correct) score++;
    results.push({ ...q, chosen: selected, correct });

    q.options.forEach((_, i) => {
      const el = document.getElementById(`opt-${i}`);
      const badge = el.querySelector('.badge');
      if (i === q.answer) { el.classList.add('correct'); badge.textContent = '✓'; }
      else if (i === selected) { el.classList.add('wrong'); badge.textContent = '✗'; }
    });

    const fb = document.getElementById('feedback');
    fb.style.display = 'block';
    const explain = q.explanation ? `<div style="margin-top:10px;font-size:13px;opacity:0.9;">${q.explanation}</div>` : '';
    if (correct) {
      fb.className = 'feedback good';
      fb.innerHTML = '✓ Correct!' + explain;
    } else {
      fb.className = 'feedback bad';
      fb.innerHTML = `✗ Correct answer: ${q.options[q.answer]}` + explain;
    }
    const marksEl = document.getElementById('question-marks');
    marksEl.textContent = score === 1 ? '1 pt' : `${score} pts`;
    if (correct) {
      marksEl.classList.remove('bounce');
      void marksEl.offsetWidth;
      marksEl.classList.add('bounce');
    }
    document.getElementById('action-btn').innerHTML = current+1 >= shuffled.length ? 'See Results' : 'Next <span class="btn-arrow">→</span>';
  } else {
    if (current+1 >= shuffled.length) { await showResults(); }
    else {
      current++; selected = null; confirmed = false;
      renderQuestion();
    }
  }
}

async function showResults() {
  document.getElementById('quiz-screen').classList.remove('active');
  document.getElementById('results-screen').classList.add('active');
  document.getElementById('leaderboard-name').disabled = false;
  document.getElementById('leaderboard-name').value = '';
  document.getElementById('submit-msg').style.display = 'none';
  const total = shuffled.length;
  const pct = Math.round((score / total) * 100);
  const numEl = document.getElementById('score-num');
  numEl.innerHTML = `${score}<span class="score-total">/${total}</span>`;
  numEl.style.color = pct >= 80 ? '#10b981' : pct >= 60 ? '#f59e0b' : '#ef4444';
  const gaugeFill = document.getElementById('score-gauge-fill');
  if (gaugeFill) {
    const arcLen = 125.6;
    gaugeFill.style.strokeDashoffset = arcLen * (1 - pct / 100);
    gaugeFill.style.stroke = pct >= 80 ? '#22c55e' : pct >= 60 ? '#ff6b35' : '#ff3355';
  }

  const leaderboard = await getTodayLeaderboard();
  const topEntry = leaderboard[0];
  const topScore = topEntry ? (topEntry.score || 0) : 0;

  let msg;
  if (leaderboard.length === 0 || score > topScore) {
    msg = "Congratulations — you have the highest score today!";
    if (typeof confetti === 'function') confetti({ particleCount: 80, spread: 70 });
  } else if (score === topScore) {
    msg = "You're tied for the lead!";
    if (typeof confetti === 'function') confetti({ particleCount: 80, spread: 70 });
  } else {
    const topName = topEntry?.name || 'the leader';
    msg = `Keep going, you've almost caught up to ${topName}!`;
  }
  document.getElementById('score-msg').textContent = msg;

  const rc = document.getElementById('review-container');
  rc.innerHTML = `<div class="review-title">Answer Review</div>` +
    results.map((r, i) => {
      const tagHtml = r.correct
        ? `<span class="tag tag-right">✓ ${r.options[r.answer]}</span>`
        : `<span class="tag tag-wrong">✗ Your answer: ${r.options[r.chosen]}</span> <span class="tag tag-right">✓ Correct: ${r.options[r.answer]}</span>`;
      const explainHtml = r.explanation ? `<div class="review-explain">${r.explanation}</div>` : '';
      return `<div class="review-item"><div class="review-q">${i+1}. ${r.q}</div>${tagHtml}${explainHtml}</div>`;
    }).join('');
}

function restartQuiz() {
  document.getElementById('quiz-screen').classList.add('active');
  document.getElementById('results-screen').classList.remove('active');
  startQuiz();
}

startQuiz();
